<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NWSSU TapIn - Duplicate Warning</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/name_warning.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="warning-card">
      <div class="warning-icon">⚠️</div>
      <h1>Duplicate Ticket Warning</h1>
      
      <p class="warning-message">
        A <strong>{{ user_type|capitalize }}</strong> with the name 
        <strong class="highlight">{{ first }} {{ last }}</strong>
        {% if sid %} (ID: <strong>{{ sid }}</strong>){% endif %}
        already has an active ticket.
      </p>

      <p class="question">Would you like to continue and request another one?</p>

      <div class="button-group">
        <!-- Continue Button -->
        <form method="POST" action="{{ url_for('process_ticket_request') }}">
          <input type="hidden" name="user_type" value="{{ user_type }}">
          <input type="hidden" name="first_name" value="{{ first }}">
          <input type="hidden" name="last_name" value="{{ last }}">
          {% if sid %}
          <input type="hidden" name="student_id" value="{{ sid }}">
          {% endif %}
          <input type="hidden" name="reason" value="{{ reason }}">
          <input type="hidden" name="force" value="true">
          <button type="submit" class="btn btn-primary">Yes, Continue</button>
        </form>

        <!-- Cancel Button -->
        <a href="{{ url_for('landing_page') }}" class="btn btn-secondary">No, Cancel</a>
      </div>
    </div>
  </div>
</body>
</html>
