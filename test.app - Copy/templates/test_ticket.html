<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Test (throwaway)</title>
</head>
<body>
    <h1>Get a Ticket (test page)</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <p><strong>{{ category }}:</strong> {{ msg|safe }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('process_ticket_request') }}">
        <label>User Type:
            <select name="user_type" required>
                <option value="student">Student</option>
                <option value="guest">Guest</option>
            </select>
        </label><br><br>

        <label>Student ID: <input type="text" name="student_id"></label><br><br>
        <label>First Name: <input type="text" name="first_name" required></label><br><br>
        <label>Last Name: <input type="text" name="last_name" required></label><br><br>

        <label>Reason:
            <select name="reason" required>
                <option value="Other">Other</option>
                <option value="Documents">Documents</option>
                <option value="Enrollment">Enrollment</option>
            </select>
        </label><br><br>
        <label>If Other, specify: <input type="text" name="reason_other"></label><br><br>

        <label>Payment Method:</label><br>
        <label><input type="radio" name="payment_method" value="cash" checked> Cash</label><br>
        <label><input type="radio" name="payment_method" value="online"> Online</label><br><br>

        <button type="submit">Get My Ticket</button>
    </form>

    <p><a href="{{ url_for('account_login') }}">Log in</a> | <a href="{{ url_for('account_signup') }}">Sign up</a></p>
</body>
</html>
